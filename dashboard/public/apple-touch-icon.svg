<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="myAI">
  <!-- Apple home-screen icon: FULL-BLEED square — iOS applies its own corner
       mask, so no transparent rounded corners here (and no white border: a
       light edge survives iOS masking and shows as a halo on a dark wallpaper).
       Same terminal window as icon.svg, squircle clip removed. -->
  <!-- window body -->
  <rect width="512" height="512" fill="#4F6B74"/>
  <!-- title bar -->
  <rect width="512" height="116" fill="#3F7CC0"/>
  <circle cx="54"  cy="58" r="17" fill="#E9C846"/>
  <circle cx="112" cy="58" r="17" fill="#F24B5C"/>
  <circle cx="170" cy="58" r="17" fill="#56D2A0"/>
  <rect x="330" y="42" width="132" height="32" rx="16" fill="#FFFFFF"/>
  <!-- prompt: >_ -->
  <g fill="none" stroke="#F2C230" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <path d="M72 168 152 212 72 256"/>
    <path d="M170 258h128"/>
  </g>
  <!-- output lines -->
  <g fill="#8FB6DC">
    <rect x="62"  y="330" width="150" height="22" rx="11"/>
    <rect x="240" y="330" width="105" height="22" rx="11"/>
    <rect x="372" y="330" width="78"  height="22" rx="11"/>

    <rect x="62"  y="378" width="78"  height="22" rx="11"/>
    <rect x="168" y="378" width="95"  height="22" rx="11"/>
    <rect x="290" y="378" width="160" height="22" rx="11"/>

    <rect x="62"  y="426" width="122" height="22" rx="11"/>
    <rect x="212" y="426" width="95"  height="22" rx="11"/>
    <rect x="335" y="426" width="115" height="22" rx="11"/>
  </g>
</svg>
