[project]
name = "llm-from-scratch"
version = "0.1.0"
description = "A deployable pipeline for a small LLM, with the model left unbuilt on purpose."
requires-python = ">=3.11"

# torch is the only heavy dependency and it is OPTIONAL by design: every
# placeholder runs in pure Python, so `./dev up` and `./dev test` work on a
# machine that cannot fit PyTorch. You need it from Stage 3 onward, which is
# also the first stage where you would actually want it.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
torch = ["torch>=2.4"]
dev = ["pytest>=8.3", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Stage tests SKIP while their placeholder is in place, so a fresh clone is
# green. `-ra` makes the skip reasons visible — that list is the to-do list.
addopts = "-ra --strict-markers"
markers = ["stage: a curriculum stage test (skips until you implement it)"]
