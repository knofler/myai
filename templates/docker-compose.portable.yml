# docker-compose.portable.yml — PORTABLE myAI self-contained stack
#
# Dropped into any target repo by `myai init <path>` (lands at
# AI/docker-compose.myai.yml, and at the repo root as docker-compose.yml when the
# repo has none). `myai up` launches it. It brings the whole single-tenant myAI
# surface up on localhost:
#
#   gateway   (MCP + HTTP/WS API)   → :3100 / :3200 / :3201
#   dashboard (Next.js console)     → :3210
#   mongo     (RAG corpus + state)  → :27200
#
# PORTABILITY: the gateway/dashboard images are BUILT from the framework install,
# not from the target repo (the target only carries the AI/ folder). Point
# MYAI_FRAMEWORK_DIR at wherever the framework lives — default assumes the common
# sibling layout (../ai_management). Override in .env:
#
#   MYAI_FRAMEWORK_DIR=/abs/path/to/ai_management
#
# (Legacy MYAI_HOME=<framework> still works here, but don't export it in a shell:
# MYAI_HOME is the per-user STATE dir — ~/.myai — for every other myAI tool.)
#
# Everything else is env-driven with safe loopback defaults — see .env.example.
# No operator paths, no secrets, no hardcoded hostnames: portable to any machine.

name: ${MYAI_PROJECT_NAME:-myai}

services:
  gateway:
    build: ${MYAI_FRAMEWORK_DIR:-${MYAI_HOME:-../ai_management}}/runtime
    # Run as the HOST user (`myai up` records MYAI_UID/MYAI_GID): the gateway
    # writes into the user's bind-mounted brain, and as root it left root-owned
    # objects there that broke the user's own git on Linux (v1 G2 B5).
    user: "${MYAI_UID:-0}:${MYAI_GID:-0}"
    container_name: ${MYAI_PROJECT_NAME:-myai}-gateway
    ports:
      # Loopback only by default (v1 gate G5): containers still reach these
      # through host.docker.internal / the compose network. HOST_BIND=0.0.0.0
      # in .env publishes them on the LAN — an explicit opt-in.
      - "${HOST_BIND:-127.0.0.1}:${MYAI_MCP_PORT:-3100}:3100"
      - "${HOST_BIND:-127.0.0.1}:${MYAI_GATEWAY_HTTP_PORT:-3200}:3200"
      - "${HOST_BIND:-127.0.0.1}:${MYAI_GATEWAY_WS_PORT:-3201}:3201"
    env_file:
      - path: .env
        required: false
    environment:
      # Unset MONGODB_URI → falls back to the bundled mongo container. Set it in
      # .env to point at Atlas / an external Mongo. Same var for the dashboard.
      # MONGO_ROOT_PASSWORD is required, no fallback (v1 gate G5; enforced by the mongo service's :? below): myai up generates it into the env file.
      - MONGODB_URI=${MONGODB_URI:-mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD}@mongo:27017/myai?authSource=admin}
      - MONGODB_NAME=${MONGODB_NAME:-myai}
      - AI_ROOT=/app/AI
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - GATEWAY_HTTP_PORT=3200
      - GATEWAY_WS_PORT=3201
      - MCP_PORT=3100
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      # Loopback bridge token — the in-cluster dashboard authenticates with it over
      # the Docker bridge; host callers stay trusted via loopback. Set in .env —
      # `myai up` generates a random one on first boot if none is present. NO
      # published fallback (a hardcoded default would ship in the npm package as
      # a known credential, SECURITY task-7f8b20a3); refused by the gateway when
      # TENANT_ENFORCE=true.
      - GATEWAY_LOCAL_TOKEN=${GATEWAY_LOCAL_TOKEN:-}
      # No published default (v1 gate G5): `myai up` writes a generated secret
      # into .env on first boot; the gateway refuses the old published value.
      - JWT_SECRET=${JWT_SECRET:-}
      # Self-serve signup on this gateway — off for a local install (a LAN or
      # container peer could otherwise create its own tenant). Hosted sets true.
      - SIGNUP_ENABLED=${SIGNUP_ENABLED:-false}
      # Anti-lockout bootstrap admin — set BOTH in .env to seed an owner login.
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # The USER's brain is bind-mounted below (v1 G2 B5); pin the gateway to the
      # container-side path (a host brain.path pointer means nothing in here).
      - MYAI_BRAIN_DIR=/myai-brain
      # A writable HOME for whichever uid the gateway runs as (container-local
      # state: recall events, distill scratch). /root is not usable by a non-root uid.
      - HOME=/tmp/myai-gateway-home
      # The bind-mounted repo may be owned by a different uid than the process
      # (e.g. MYAI_UID unset → root) — without this git dies on "dubious ownership".
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=*
    mem_limit: ${GATEWAY_MEM_LIMIT:-1g}
    mem_reservation: ${GATEWAY_MEM_RESERVATION:-256m}
    volumes:
      # The target repo's AI/ framework folder, mounted read-only. A standalone/
      # greenfield `myai up` (no per-project AI/ folder — scripts/myai_up.sh)
      # overrides this to the framework install itself via MYAI_AI_MOUNT.
      - ${MYAI_AI_MOUNT:-./AI}:/app/AI:ro
      # The user's brain (git repo) — the same one `myai brain` uses. `myai up`
      # records its path as MYAI_BRAIN_HOST in this stack's .env. Without the
      # mount the gateway kept a private brain inside the container that the
      # user never saw and that a rebuild dropped (v1 G2 B5).
      - ${MYAI_BRAIN_HOST:-~/.myai/brain}:/myai-brain
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3200/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 15s
    restart: unless-stopped
    networks:
      - myai-net

  dashboard:
    build: ${MYAI_FRAMEWORK_DIR:-${MYAI_HOME:-../ai_management}}/dashboard
    container_name: ${MYAI_PROJECT_NAME:-myai}-dashboard
    ports:
      # Loopback-only by default (v1 G2): it is what lets loopback-gate.js sign
      # the local user in (DASHBOARD_LOCAL_AUTOLOGIN below) without exposing the
      # dashboard to the LAN. HOST_BIND=0.0.0.0 publishes it on every interface
      # and, by the same rule, turns auto-login off (operator login then).
      - "${HOST_BIND:-127.0.0.1}:${MYAI_DASHBOARD_PORT:-3210}:3210"
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD}@mongo:27017/myai?authSource=admin}
      - AI_ROOT=/app/AI
      - GATEWAY_MCP_URL=http://gateway:3100/mcp
      - GATEWAY_LOCAL_TOKEN=${GATEWAY_LOCAL_TOKEN:-}
      # Loopback default → no login wall. Set true only for an internet-exposed deploy.
      - REQUIRE_LOGIN=${REQUIRE_LOGIN:-false}
      # Local auto-login: the single-operator gate (middleware.ts) otherwise
      # sends a fresh install to /operator-login with no credentials to give.
      # loopback-gate.js honours it ONLY while HOST_BIND=127.0.0.1.
      - DASHBOARD_LOCAL_AUTOLOGIN=${DASHBOARD_LOCAL_AUTOLOGIN:-1}
      - HOST_BIND=${HOST_BIND:-127.0.0.1}
    mem_limit: ${DASHBOARD_MEM_LIMIT:-512m}
    mem_reservation: ${DASHBOARD_MEM_RESERVATION:-128m}
    volumes:
      - ${MYAI_AI_MOUNT:-./AI}:/app/AI:ro
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3210/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 15s
    restart: unless-stopped
    networks:
      - myai-net

  mongo:
    image: mongo:7
    container_name: ${MYAI_PROJECT_NAME:-myai}-mongo
    ports:
      # Loopback only (v1 gate G5): the store must never face the LAN.
      - "${MONGO_HOST_BIND:-127.0.0.1}:${MYAI_MONGO_PORT:-27200}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?}
    mem_limit: ${MONGO_MEM_LIMIT:-512m}
    mem_reservation: ${MONGO_MEM_RESERVATION:-128m}
    volumes:
      - myai-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      start_period: 30s
    restart: unless-stopped
    networks:
      - myai-net

volumes:
  myai-mongo-data:

networks:
  myai-net:
    driver: bridge
